<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a living mountain scene fills the screen and reacts to your altitude; one frosted-glass card floats over it, with an altimeter rail on the right */
:root{
  --glass:rgba(10,15,30,.56); --glass-hi:rgba(255,255,255,.08); --edge:rgba(255,255,255,.16);
  --ink:#f4f7fc; --muted:#a9b6c9; --accent:#ff7d8f; --accent-ink:#22060d;
  --t0:#c3ccd8; --t1:#4fe0a0; --t2:#6aa8ff; --t3:#b48cff; --t4:#ffcf4a; --miss:#56627a;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:#1d2747;color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.app{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;gap:18px;padding-inline:16px;padding-block:16px 28px;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:1100px;width:100%;margin:0 auto}
.logo{font-family:var(--display);font-weight:900;font-size:1.35rem;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:10px;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.logo svg{width:30px;height:30px}
.hright{display:flex;gap:10px;align-items:center}
.pill{display:none;font:700 .8rem var(--mono);padding:8px 12px;border-radius:999px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.pill small{color:var(--muted);font-weight:500;margin-left:6px}
.modes{display:flex;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--edge);border-radius:999px;padding:4px}
.modes button{border:0;background:transparent;color:var(--muted);font:600 .85rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#0b1020}
main{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.card{position:relative;width:100%;max-width:580px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);border:1px solid var(--edge);border-radius:24px;padding:26px;box-shadow:0 30px 80px -20px rgba(0,0,0,.55),inset 0 1px 0 var(--glass-hi);display:flex;flex-direction:column;gap:18px;box-sizing:border-box;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog{display:flex;gap:6px;flex:1;max-width:260px}
.prog i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.14)}
.prog i.now{background:rgba(255,255,255,.55);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.lbl{font:600 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score{font:700 1.1rem var(--mono);font-variant-numeric:tabular-nums}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .rb{stroke:rgba(255,255,255,.12)}
.ring .rf{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:138.2;transition:stroke .3s}
.ring.low .rf{stroke:var(--t4)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:700 .95rem var(--mono);font-variant-numeric:tabular-nums}
.prompt{font-family:var(--display);font-weight:800;font-size:clamp(1.45rem,5vw,2.15rem);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
form{display:flex;gap:10px}
input{flex:1;min-width:0;font:600 1.15rem var(--body);padding:15px 16px;border-radius:14px;border:1.5px solid var(--edge);background:rgba(255,255,255,.07);color:var(--ink)}
input::placeholder{color:#8291a8}
input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.1);box-shadow:0 0 0 4px rgba(255,125,143,.18)}
button{font-family:var(--body);cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.go{width:56px;flex:none;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.go svg{width:22px;height:22px}
.guesses{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}
.guesses span{font-size:.82rem;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);text-decoration:line-through;animation:pop .25s ease-out}
.guesses span.note{text-decoration:none;font-style:italic}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-8px)}50%{transform:translateX(7px)}80%{transform:translateX(-3px)}}
.stamp{align-self:flex-start;font:900 .82rem var(--display);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;border-radius:10px;border:2px solid var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);transform:rotate(-3deg);animation:stamp .5s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 0 30px -6px var(--c)}
@keyframes stamp{0%{transform:scale(2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
.answer{font-family:var(--display);font-weight:900;font-size:clamp(1.8rem,7vw,2.8rem);line-height:1;margin:0;color:var(--c);text-shadow:0 0 40px color-mix(in srgb,var(--c) 45%,transparent)}
.gain{font:700 1rem var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.gain span{color:var(--muted);font-weight:500}
.reveal{display:grid;gap:8px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.reveal p{margin:0;color:var(--muted);font-size:.92rem}
.reveal b{color:var(--ink);font-weight:600}
.reveal .gold{color:var(--t4)}
.primary{align-self:flex-start;font:700 1rem var(--body);padding:14px 22px;border-radius:14px;border:0;background:var(--ink);color:#0b1020;display:inline-flex;align-items:center;gap:8px;transition:transform .1s}
.primary:hover{transform:translateY(-1px)}
.ghost{font:600 .95rem var(--body);padding:13px 18px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.hero{font-family:var(--display);font-weight:900;font-size:clamp(2.2rem,9vw,3.6rem);line-height:.95;margin:0;letter-spacing:-.02em}
.hero em{font-style:normal;color:var(--t4)}
.sub{margin:0;color:var(--muted);font-size:1.02rem;max-width:44ch}
.ladder{display:grid;gap:6px}
.ladder div{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;font-size:.88rem}
.ladder b{font:800 .66rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--c)}
.ladder span{color:var(--muted)}
.ladder i{font:700 .78rem var(--mono);font-style:normal;color:var(--ink)}
.ladder em{font-style:normal;color:var(--ink)}
.big{font-family:var(--display);font-weight:900;font-size:clamp(2.4rem,10vw,3.8rem);line-height:.95;margin:0;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted);font-weight:700;margin-left:4px}
.zone{font:800 .8rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--t4)}
.profile{width:100%;height:auto;display:block}
.emoji{font-size:1.5rem;letter-spacing:.14em}
.toast{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:900 .8rem var(--display);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:12px;background:var(--c);color:#0b1020;white-space:nowrap;animation:rise 1.4s ease-out forwards;pointer-events:none;box-shadow:0 10px 30px -8px var(--c)}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.rail{position:fixed;right:22px;top:92px;bottom:60px;width:86px;z-index:1;pointer-events:none}
.rail .line{position:absolute;right:0;top:0;bottom:0;width:2px;background:linear-gradient(to top,rgba(255,255,255,.15),rgba(255,255,255,.5))}
.rail .tk{position:absolute;right:0;display:flex;align-items:center;gap:6px;transform:translateY(50%);font:500 .62rem var(--mono);color:rgba(255,255,255,.7);text-shadow:0 1px 6px rgba(0,0,0,.5)}
.rail .tk::after{content:"";width:10px;height:2px;background:rgba(255,255,255,.6)}
.rail .tk b{font:800 .55rem var(--display);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-right:2px}
.rail .me{position:absolute;right:-7px;transform:translateY(50%);display:flex;align-items:center;gap:8px;flex-direction:row-reverse}
.rail .me i{width:16px;height:16px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px rgba(255,125,143,.3),0 0 22px var(--accent)}
.rail .me{z-index:2}.rail .me span{font:700 .8rem var(--mono);background:rgba(10,15,30,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--edge);padding:5px 9px;border-radius:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:820px){.rail{display:none}.pill{display:inline-block}}
@media (max-width:440px){.card{padding:20px;border-radius:20px}.ladder div{grid-template-columns:84px 1fr auto}.logo span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>[hidden]{display:none!important}body{margin:0}</style>

const SUMMIT=8849, MAXPTS=700, ROUND=25, PENALTY=2, ROUNDS=7, CIRC=138.2;
const TC=["#c3ccd8","#4fe0a0","#6aa8ff","#b48cff","#ffcf4a"];

// ---------- matching ----------
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g,"and").trim().replace(/^the\s+/,"").replace(/[^a-z0-9+#]/g,"");
const title=s=>s.replace(/(^|[\s-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
function build(p){if(p.map)return p.map;const m={};
  const add=(item,tier)=>{const al=item.split("/");const disp=title(al[0]);for(const a of al){const k=norm(a);if(k&&!(k in m))m[k]={tier,disp};}};
  p.t.forEach((s,i)=>s.split(",").forEach(it=>add(it.trim(),i)));add(p.r,4);p.map=m;return m;}
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){const cur=[i];let best=i;for(let j=1;j<=b.length;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));best=Math.min(best,cur[j]);}if(best>max)return max+1;prev=cur;}return prev[b.length];}
function lookup(p,input){const m=build(p);const k=norm(input);if(!k)return null;if(m[k])return {...m[k],key:k};
  for(const v of [k.replace(/ies$/,"y"),k.replace(/es$/,""),k.replace(/s$/,""),k+"s"])if(m[v])return {...m[v],key:v};
  if(k.length>=5){const max=k.length>=9?2:1;let best=null,bd=max+1;for(const key in m){if(key.length<5)continue;const d=lev(k,key,max);if(d<bd){bd=d;best=key;}}if(best)return {...m[best],key:best};}
  return null;}

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const card=$("card");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function rng(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}
function shuffled(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const metres=pts=>Math.round(pts*SUMMIT/MAXPTS);
const band=m=>m>=8000?"Summit":m>=6000?"Death Zone":m>=4000?"Glacier":m>=2000?"Treeline":"Base Camp";
const fmt=n=>Math.round(n).toLocaleString("en-US");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

// =====================================================================
// SCENE — layered ridges, sky that darkens to stars as you climb, wind-blown snow, cloud band, sparkle bursts
// =====================================================================
const cv=$("sky"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
const S={alt:0,target:0,time:0,snow:[],stars:[],spark:[],layers:[]};
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const SKY=[[0,"#3a3d78","#f4a982"],[.28,"#2d68ad","#bfe0f2"],[.6,"#163a76","#6b99cf"],[.85,"#0a1434","#34417f"],[1,"#03050d","#1f2556"]].map(([t,a,b])=>[t,hex(a),hex(b)]);
function skyAt(t){for(let i=0;i<SKY.length-1;i++){const [t0,a0,b0]=SKY[i],[t1,a1,b1]=SKY[i+1];if(t<=t1){const k=(t-t0)/(t1-t0);return [mix(a0,a1,k),mix(b0,b1,k)];}}return [SKY[4][1],SKY[4][2]];}
function ridge(seed,n,rough){const r=rng(seed);const pts=new Array(n+1).fill(0);pts[0]=r();pts[n]=r();
  (function sub(a,b,d){if(b-a<2)return;const m=(a+b)>>1;pts[m]=(pts[a]+pts[b])/2+(r()-.5)*d;sub(a,m,d*rough);sub(m,b,d*rough);})(0,n,1);
  const mn=Math.min(...pts),mx=Math.max(...pts);return pts.map(v=>(v-mn)/(mx-mn||1));}
function setupScene(){
  // depth 0 = farthest
  S.layers=[
    {pts:ridge("peak",256,.56),base:.60,amp:.36,par:.10,snow:.42,dark:.30},
    {pts:ridge("range",256,.58),base:.68,amp:.26,par:.22,snow:.30,dark:.48},
    {pts:ridge("ridge",256,.6),base:.77,amp:.22,par:.40,snow:.12,dark:.64},
    {pts:ridge("hill",128,.62),base:.86,amp:.18,par:.66,snow:0,dark:.80},
    {pts:ridge("near",64,.66),base:.95,amp:.16,par:1.0,snow:0,dark:.92}];
  // make the far layer's middle the summit
  const p=S.layers[0].pts,n=p.length-1;for(let i=0;i<=n;i++){const d=Math.abs(i/n-.62);p[i]=Math.min(1,p[i]*.55+Math.max(0,1-d*3.2)*.75);}
  const r=rng("stars");S.stars=Array.from({length:180},()=>({x:r(),y:r()*.7,s:r()*1.4+.3,tw:r()*6}));
  const r2=rng("snow");S.snow=Array.from({length:220},()=>({x:r2(),y:r2(),r:r2()*1.8+.5,v:r2()*.5+.5}));
}
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;}
function burst(color,n){const x=W/2,y=Math.min(H*.42,H/2-80);for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=2+Math.random()*7;
  S.spark.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,life:1,c:color,r:1.5+Math.random()*2.5});}}
let lastT=0;
function frame(now){const dt=Math.min(50,now-(lastT||now))/16.67;lastT=now;S.time+=dt;
  S.alt+=reduce?(S.target-S.alt):(S.target-S.alt)*.035*dt;
  const t=Math.min(1,S.alt/SUMMIT);
  cx.setTransform(DPR,0,0,DPR,0,0);
  const [top,bot]=skyAt(t);
  const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,rgb(top));g.addColorStop(1,rgb(bot));cx.fillStyle=g;cx.fillRect(0,0,W,H);
  // stars
  const sa=Math.max(0,(t-.45)/.55);if(sa>0){for(const s of S.stars){const tw=.6+.4*Math.sin(S.time*.05+s.tw);cx.fillStyle=`rgba(255,255,255,${sa*tw*.9})`;cx.fillRect(s.x*W,s.y*H,s.s,s.s);}}
  // sun → moon
  const warm=hex("#ffd9a8"),pale=hex("#e8eeff");const sc=mix(warm,pale,Math.min(1,t*1.6));
  const sx=W*.74,sy=H*(.3-t*.12),sr=Math.min(W,H)*.05;
  const sg=cx.createRadialGradient(sx,sy,0,sx,sy,sr*7);sg.addColorStop(0,rgb(sc,.55));sg.addColorStop(1,rgb(sc,0));cx.fillStyle=sg;cx.fillRect(0,0,W,H);
  cx.beginPath();cx.arc(sx,sy,sr,0,7);cx.fillStyle=rgb(sc,.95);cx.fill();
  // ridges
  const climb=t*H*1.15;
  S.layers.forEach((L,i)=>{const n=L.pts.length-1;const baseY=H*L.base+climb*L.par;const amp=H*L.amp;
    if(baseY-amp>H+20)return;
    const col=mix(bot,hex("#0b1124"),L.dark);
    cx.beginPath();cx.moveTo(0,H+2);let minY=H;
    for(let k=0;k<=n;k++){const x=k/n*W,y=baseY-L.pts[k]*amp;if(y<minY)minY=y;cx.lineTo(x,y);}
    cx.lineTo(W,H+2);cx.closePath();
    if(L.snow>0){const lg=cx.createLinearGradient(0,minY,0,minY+amp*.9);lg.addColorStop(0,"rgba(250,252,255,.96)");lg.addColorStop(L.snow,rgb(mix(col,[255,255,255],.25)));lg.addColorStop(Math.min(1,L.snow+.25),rgb(col));lg.addColorStop(1,rgb(col));cx.fillStyle=lg;}
    else cx.fillStyle=rgb(col);
    cx.fill();
    // haze between layers
    if(i<S.layers.length-1){const hg=cx.createLinearGradient(0,baseY-amp*.3,0,baseY+40);hg.addColorStop(0,rgb(bot,0));hg.addColorStop(.75,rgb(bot,.16));hg.addColorStop(1,rgb(bot,0));cx.fillStyle=hg;cx.fillRect(0,baseY-amp*.3,W,amp*.3+40);}
  });
  // cloud band you pass through around 3–5 km
  const cy=H*(1.25-t*2.3);if(cy>-H*.3&&cy<H*1.3){for(let k=0;k<9;k++){const x=((k*0.137+S.time*.0004*(1+k%3))%1.2-.1)*W,y=cy+Math.sin(k*1.7)*H*.05,r=W*.18+(k%4)*W*.04;
    const cg=cx.createRadialGradient(x,y,0,x,y,r);cg.addColorStop(0,"rgba(255,255,255,.42)");cg.addColorStop(1,"rgba(255,255,255,0)");cx.fillStyle=cg;cx.fillRect(x-r,y-r,r*2,r*2);}}
  // snow — denser & windier with altitude
  const count=Math.floor(40+t*180),wind=.6+t*4;
  cx.fillStyle="rgba(255,255,255,.75)";
  for(let k=0;k<count;k++){const s=S.snow[k];if(!reduce){s.x+=wind*s.v*dt/W*2.2;s.y+=s.v*dt*1.3/H*1.6;if(s.x>1)s.x-=1;if(s.y>1)s.y-=1;}
    cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,7);cx.fill();}
  // sparks
  for(let k=S.spark.length-1;k>=0;k--){const p=S.spark[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.18*dt;p.vx*=.985;p.life-=.016*dt;
    if(p.life<=0){S.spark.splice(k,1);continue;}cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill();}
  cx.globalAlpha=1;
  // HUD
  const m=Math.round(S.alt);$("meT").textContent=fmt(m)+" m";$("me").style.bottom=(Math.min(1,S.alt/SUMMIT)*100)+"%";
  $("pill").innerHTML=`${fmt(m)} m<small>${band(m)}</small>`;
  requestAnimationFrame(frame);}
function setAlt(m){S.target=m;}
// rail ticks
[[2000,"Treeline"],[4000,"Glacier"],[6000,"Death zone"],[8849,"Summit"]].forEach(([h,n])=>{const d=document.createElement("div");d.className="tk";d.style.bottom=(h/SUMMIT*100)+"%";d.innerHTML=`<b>${n}</b>${h?fmt(h):"0"}`;$("rail").appendChild(d);});
setupScene();resize();addEventListener("resize",resize);requestAnimationFrame(frame);

let mode="daily", st=null, tick=null;
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function startTimer(onEnd){stopTimer();let last=performance.now();
  tick=setInterval(()=>{const now=performance.now();st.time-=(now-last)/1000;last=now;drawRing();if(st.time<=0){st.time=0;drawRing();stopTimer();onEnd();}},100);}
function drawRing(){const rf=$("rf");if(!rf)return;const full=mode==="daily"?ROUND:st.cap;const f=Math.max(0,Math.min(1,st.time/full));
  rf.style.strokeDashoffset=CIRC*(1-f);$("ring").classList.toggle("low",st.time<6);$("tleft").textContent=Math.ceil(st.time);}
const ringHTML=`<div class="ring" id="ring"><svg viewBox="0 0 52 52"><circle class="rb" cx="26" cy="26" r="22"/><circle class="rf" id="rf" cx="26" cy="26" r="22"/></svg><span id="tleft">25</span></div>`;
const arrow=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
function progHTML(){if(mode!=="daily")return `<div><div class="lbl">Score</div><div class="score">${fmt(st.score)} pts</div></div>`;
  let h="";for(let i=0;i<ROUNDS;i++){const l=st.log[i];h+=l===undefined?`<i class="${i===st.i?"now":""}"></i>`:`<i style="background:${l<0?"var(--miss)":TC[l]}"></i>`;}
  return `<div style="flex:1"><div class="lbl" style="margin-bottom:8px">Prompt ${st.i+1} of ${ROUNDS}</div><div class="prog">${h}</div></div>`;}

function playView(){const p=st.prompts[st.i];
  card.innerHTML=`<div class="top">${progHTML()}${ringHTML}</div>
    <h2 class="prompt">${esc(p.q)}</h2>
    <form id="f" autocomplete="off"><input id="ans" placeholder="Type an answer…" aria-label="Your answer" enterkeyhint="go" autocapitalize="off" spellcheck="false"><button class="go" type="submit" aria-label="Submit answer">${arrow}</button></form>
    <div class="guesses" id="gs"></div>`;
  drawRing();const inp=$("ans");inp.focus();
  $("f").onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v)return;inp.value="";guess(v);};}
function chip(text,note){const s=document.createElement("span");s.textContent=text;if(note)s.className="note";$("gs").prepend(s);}
function guess(v){const p=st.prompts[st.i];const hit=lookup(p,v);
  if(!hit){st.time=Math.max(0,st.time-PENALTY);chip(v);const f=$("f");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");drawRing();return;}
  if(mode==="endless"){if(st.used.has(p.q+"|"+hit.key)){chip(hit.disp+" · used",true);return;}
    st.used.add(p.q+"|"+hit.key);const t=TIER[hit.tier];st.score+=t.p;st.time=Math.min(st.cap,st.time+t.s);st.log.push(hit.tier);
    setAlt(metres(st.score));celebrate(hit.tier);nextEndless();toast(`${hit.disp} · ${t.n} +${t.p}`,TC[hit.tier]);return;}
  stopTimer();finishRound(hit);}
function celebrate(tier){if(tier>=3)burst(TC[tier],tier===4?140:60);else if(tier===2)burst(TC[2],24);}
function toast(text,c){const d=document.createElement("div");d.className="toast";d.style.setProperty("--c",c);d.textContent=text;card.appendChild(d);setTimeout(()=>d.remove(),1500);}
function countUp(el,from,to,suffix){if(reduce){el.textContent=fmt(to)+suffix;return;}const t0=performance.now();
  (function s(n){const k=Math.min(1,(n-t0)/900),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e)+suffix;if(k<1)requestAnimationFrame(s);})(t0);}

// ---------- daily ----------
function startDaily(){stopTimer();mode="daily";
  const saved=store.get("altitude.daily")||store.get("rareair.daily");
  if(saved&&saved.date===today()){st=saved;setAlt(metres(st.score));return summaryView();}
  const r=rng("rareair-"+today());st={date:today(),prompts:shuffled(P,r).slice(0,ROUNDS),i:0,score:0,log:[],answers:[],time:ROUND};
  setAlt(0);roundStart();}
function roundStart(){st.time=ROUND;playView();startTimer(()=>finishRound(null));}
function finishRound(hit){const p=st.prompts[st.i];build(p);const before=metres(st.score);
  if(hit){st.score+=TIER[hit.tier].p;st.log.push(hit.tier);st.answers.push(hit.disp);celebrate(hit.tier);}else{st.log.push(-1);st.answers.push(null);}
  const after=metres(st.score);setAlt(after);
  const c=hit?TC[hit.tier]:"#8592a8",t=hit?TIER[hit.tier]:null;
  const deep=shuffled(p.t[3].split(",").map(s=>title(s.split("/")[0].trim())),Math.random).slice(0,3).join(" · ");
  const rare=title(p.r.split("/")[0]);const last=st.i===ROUNDS-1;
  card.innerHTML=`<div class="top">${progHTML()}</div>
    <div class="lbl">${esc(p.q)}</div>
    <div style="--c:${c};display:flex;flex-direction:column;gap:12px">
      <span class="stamp">${t?t.n:"Out of time"}</span>
      <p class="answer">${hit?esc(hit.disp):"No answer"}</p>
      <div class="gain">${t?`+${t.p} pts <span>·</span> +<span id="gm" style="color:var(--ink)">0</span> <span>m climbed</span>`:`<span>You hold your position at ${fmt(after)} m</span>`}</div>
    </div>
    <div class="reveal">
      <p>Rare air answer: <b class="gold">${esc(rare)}</b>${hit&&hit.tier===4?" ← that's you":""}</p>
      <p>Deep cuts: <b>${esc(deep)}</b></p>
    </div>
    <button class="primary" id="nx">${last?"See your climb":"Next prompt"} ${arrow.replace('viewBox','width="18" height="18" viewBox')}</button>`;
  if(t)countUp($("gm"),0,after-before,"");
  const nx=$("nx");nx.focus();nx.onclick=()=>{if(last){store.set("altitude.daily",strip(st));summaryView();}else{st.i++;roundStart();}};}
function strip(s){return {date:s.date,score:s.score,log:s.log,answers:s.answers};}
function profileSVG(log){const W=320,H=150,x0=14,x1=306,y0=128,y1=22;let cum=0;const pts=[[x0,y0]];
  log.forEach((l,i)=>{cum+=l<0?0:TIER[l].p;pts.push([x0+(i+1)*(x1-x0)/ROUNDS,y0-(metres(cum)/SUMMIT)*(y0-y1)]);});
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts[pts.length-1][0].toFixed(1)} ${y0} L ${x0} ${y0} Z`;
  const dots=pts.slice(1).map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="${log[i]<0?"#56627a":TC[log[i]]}" stroke="#0b1020" stroke-width="2"/>`).join("");
  return `<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Your climb, prompt by prompt">
    <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient></defs>
    <line x1="${x0}" x2="${x1}" y1="${y1}" y2="${y1}" stroke="#ffcf4a" stroke-dasharray="4 5" stroke-width="1.5" opacity=".8"/>
    <text x="${x1}" y="${y1-7}" text-anchor="end" fill="#ffcf4a" font-family="JetBrains Mono, monospace" font-size="10">SUMMIT 8,849 m</text>
    <line x1="${x0}" x2="${x1}" y1="${y0}" y2="${y0}" stroke="rgba(255,255,255,.25)"/>
    <path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;}
function summaryView(){const m=metres(st.score);setAlt(m);const em=st.log.map(t=>t<0?"⬛":TIER[t].e).join("");
  const share=`Altitude · ${st.date}\n${em}\n${fmt(m)} m · ${band(m)}`;
  card.innerHTML=`<div class="top"><div><div class="lbl">Daily climb · ${st.date}</div></div></div>
    <div><div class="zone">${band(m)}</div><p class="big"><span id="bm">0</span><small>m</small></p></div>
    ${profileSVG(st.log)}
    <div class="emoji" aria-label="Your answers by tier">${em}</div>
    <p class="sub" style="font-size:.92rem">${fmt(st.score)} points. A new climb opens at 00:00 UTC.</p>
    <div class="row"><button class="primary" id="cp">Copy result</button><button class="ghost" id="toE">Play endless</button></div>
    <pre id="sh" hidden style="white-space:pre-wrap;font-family:var(--mono);font-size:.85rem;margin:0">${esc(share)}</pre>`;
  countUp($("bm"),0,m,"");if(m>=8000)burst("#ffcf4a",160);
  $("cp").onclick=()=>{const b=$("cp");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(share).then(()=>{b.textContent="Copied ✓";},()=>{$("sh").hidden=false;b.textContent="Copy the text below";});}else{$("sh").hidden=false;}};
  $("toE").onclick=()=>setMode("endless");}

// ---------- endless ----------
function startEndless(){stopTimer();mode="endless";st={prompts:[],i:0,score:0,log:[],used:new Set(),time:45,cap:45,order:shuffled(P,Math.random),k:0};
  setAlt(0);st.prompts=[st.order[0]];playView();startTimer(endEndless);}
function nextEndless(){st.k=(st.k+1)%st.order.length;st.prompts=[st.order[st.k]];playView();}
function endEndless(){const best=Math.max(store.get("rareair.best")||0,st.score);store.set("rareair.best",best);const m=metres(st.score);
  card.innerHTML=`<div class="top"><div><div class="lbl">Endless · best ${fmt(best)} pts</div></div></div>
    <div><div class="zone">Out of oxygen · ${band(m)}</div><p class="big"><span id="bm">0</span><small>m</small></p></div>
    <div class="emoji">${st.log.map(t=>TIER[t].e).join("")||"⬛"}</div>
    <p class="sub" style="font-size:.92rem">${fmt(st.score)} points from ${st.log.length} answers. Rarer answers refill more oxygen.</p>
    <div class="row"><button class="primary" id="again">Climb again</button><button class="ghost" id="toD">Daily climb</button></div>`;
  countUp($("bm"),0,m,"");$("again").onclick=startEndless;$("toD").onclick=()=>setMode("daily");$("again").focus();}

const ladder=`<div class="ladder">${TIER.map((t,i)=>`<div style="--c:${TC[i]}"><b>${t.n}</b><span>${["Apple","Mango","Lychee","Feijoa","Lucuma"][i]}</span><i>+${t.p}</i></div>`).join("")}</div>`;
function setMode(m){$("mDaily").setAttribute("aria-pressed",m==="daily");$("mEndless").setAttribute("aria-pressed",m==="endless");
  if(m==="daily")dailyIntro();else endlessIntro();}
function endlessIntro(){stopTimer();mode="endless";setAlt(0);const best=store.get("rareair.best")||0;
  card.innerHTML=`<div class="lbl">Endless · best ${fmt(best)} pts</div>
    <p class="hero">Climb until your <em>oxygen</em> runs out.</p>
    <p class="sub">You start with 45 seconds of air. Every valid answer jumps you to a new prompt and refills it, from 8s for a common answer up to 20s for rare air. Wrong guesses cost 2s.</p>
    <button class="primary" id="go">Start climbing ${arrow.replace('viewBox','width="18" height="18" viewBox')}</button>`;
  $("go").onclick=startEndless;$("go").focus();}
function dailyIntro(){stopTimer();mode="daily";const saved=store.get("altitude.daily")||store.get("rareair.daily");if(saved&&saved.date===today()){startDaily();return;}
  setAlt(0);
  card.innerHTML=`<div class="lbl">Daily climb · ${today()}</div>
    <p class="hero">Obvious answers keep you at base camp. <em>Rare ones</em> take you to the summit.</p>
    <p class="sub">7 prompts, 25 seconds each. Name one valid answer per prompt. Example for “Name a fruit”:</p>
    ${ladder}
    <button class="primary" id="go">Start today's climb ${arrow.replace('viewBox','width="18" height="18" viewBox')}</button>`;
  $("go").onclick=startDaily;}
$("mDaily").onclick=()=>setMode("daily");$("mEndless").onclick=()=>setMode("endless");
dailyIntro();
})();
</script>
</body>
</html>
